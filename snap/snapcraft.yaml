name: orbital-ai
title: ORBITAL
base: core24
icon: snap/gui/orbital-ai.svg
adopt-info: orbital
summary: ORBITAL - Türkçe yapay zekâ asistanı ve kodlama yardımcısı
description: |
  Origin Edge'in Qt ile yazılmış masaüstü yapay zekâ uygulaması: sohbet,
  ORBITAL Code kodlama yardımcısı, eklenti mağazası ve otomatik güncelleme
  bildirimi. https://orbital.oedge.xyz
website: https://orbital.oedge.xyz
contact: destek@oedge.xyz
license: Proprietary
grade: stable
confinement: strict
platforms:
  amd64:

apps:
  orbital-ai:
    # Sarmalayıcı: paketteki araçlar (node, npx, rg, git) KDE ortamınınkilerden önce gelsin
    command: bin/orbital-ai
    extensions: [kde-neon-6]
    common-id: io.github.kefy266.orbital
    plugs:
      - network
      - home
      - removable-media

parts:
  orbital:
    plugin: qmake
    source: .
    qmake-major-version: 6
    qmake-parameters:
      - CONFIG+=release
    qmake-project-file: orbital.pro
    override-pull: |
      craftctl default
      craftctl set version="$(python3 -c 'import json;print(json.load(open("version.json"))["version"])')"
    override-build: |
      craftctl default
      install -Dm755 build/orbital "$CRAFT_PART_INSTALL/usr/bin/orbital"

  # ORBITAL Code motorunun (opencode) ve araç komutlarının ihtiyaçları.
  # Snap içinde GNU tar arşiv açamadığı için opencode'un ripgrep'i kendisi indirip açmasına bırakılmaz;
  # KDE ortamındaki Ubuntu node 18 ise /usr/share/nodejs'e bağlı olduğundan snap'te çöker: resmi Node kullanılır.
  araclar:
    plugin: nil
    stage-packages:
      - ripgrep
      - git
    build-packages: [curl, xz-utils, ca-certificates]
    override-build: |
      craftctl default
      SURUM=v22.21.1
      OZET=680d3f30b24a7ff24b98db5e96f294c0070f8f9078df658da1bce1b9c9873c88
      curl -fsSL -o node.tar.xz "https://nodejs.org/dist/$SURUM/node-$SURUM-linux-x64.tar.xz"
      echo "$OZET  node.tar.xz" | sha256sum -c -
      install -d "$CRAFT_PART_INSTALL/opt/node"
      tar -xJf node.tar.xz -C "$CRAFT_PART_INSTALL/opt/node" --strip-components=1
      rm -rf "$CRAFT_PART_INSTALL/opt/node/include" "$CRAFT_PART_INSTALL/opt/node/share/doc" "$CRAFT_PART_INSTALL/opt/node/share/man"
      install -d "$CRAFT_PART_INSTALL/bin"
      cat > "$CRAFT_PART_INSTALL/bin/orbital-ai" <<'S'
      #!/bin/sh
      export PATH="$SNAP/opt/node/bin:$SNAP/usr/bin:$SNAP/bin:$PATH"
      exec "$SNAP/usr/bin/orbital" "$@"
      S
      chmod 755 "$CRAFT_PART_INSTALL/bin/orbital-ai"
